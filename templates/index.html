
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АвтоЕсеп | Басқару жүйесі</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1224;
    color: white;
}
header {
    padding: 25px 5%;
    background: #111d38;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo { font-size: 25px; font-weight: bold; color: #60a5fa; }
nav a { color: white; margin-left: 20px; text-decoration: none; }
main { padding: 35px 5%; }
h1 { font-size: 32px; }
.subtitle { color: #9caecb; }
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap: 20px;
    margin: 30px 0;
}
.card {
    padding: 25px;
    border-radius: 18px;
    background: linear-gradient(145deg,#1d3158,#101a32);
    border: 1px solid #344b75;
    box-shadow: 0 10px 25px #0005;
}
.number { font-size: 38px; font-weight: bold; color: #60a5fa; }
table {
    width: 100%;
    border-collapse: collapse;
    background: #172440;
    border-radius: 12px;
    overflow: hidden;
}
th,td { padding: 16px; text-align: left; border-bottom: 1px solid #34425e; }
th { color: #60a5fa; }
button {
    background: #2563eb;
    color: white;
    border: 0;
    padding: 13px 20px;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>
<body>
<header>
    <div class="logo">🚘 АВТОЕСЕП</div>
    <nav>
        <a href="/">Басқару панелі</a>
        <a href="#cars">Көліктер</a>
        <a href="#owners">Иелер</a>
    </nav>
</header>

<main>
    <h1>Көлік құралдарын есепке алу жүйесі</h1>
    <p class="subtitle">Көліктерді, иелерді және техникалық байқауды басқару</p>

    <div class="cards">
        <div class="card">
            <p>Барлық көлік</p>
            <div class="number" id="carCount">0</div>
        </div>
        <div class="card">
            <p>Көлік иелері</p>
            <div class="number" id="ownerCount">0</div>
        </div>
        <div class="card">
            <p>Байқау жазбалары</p>
            <div class="number" id="inspectionCount">0</div>
        </div>
    </div>

    <section id="cars">
        <h2>🚗 Тіркелген көліктер</h2>
        <table>
            <thead>
                <tr>
                    <th>Мемлекеттік нөмір</th>
                    <th>Маркасы</th>
                    <th>Моделі</th>
                    <th>Жылы</th>
                </tr>
            </thead>
            <tbody id="carTable"></tbody>
        </table>
    </section>
</main>

<script>
async function loadData() {
    try {
        const response = await fetch('/api/data');
        const data = await response.json();

        document.getElementById('carCount').textContent =
            data.vehicles.length;
        document.getElementById('ownerCount').textContent =
            data.owners.length;
        document.getElementById('inspectionCount').textContent =
            data.inspections.length;

        document.getElementById('carTable').innerHTML =
            data.vehicles.map(car => `
                <tr>
                    <td>${car.plate_number}</td>
                    <td>${car.brand}</td>
                    <td>${car.model}</td>
                    <td>${car.year}</td>
                </tr>
            `).join('');
    } catch (error) {
        console.error('Деректерді жүктеу қатесі:', error);
    }
}
loadData();
</script>
</body>
</html>
